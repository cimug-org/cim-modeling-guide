name: Publish website

# Run from the Actions tab with "Use workflow from: master".
# Builds branch v<version> with that branch's own pinned tools and publishes it
# to gh-pages with mike as <version> (optionally also as "latest").
# To offer a new version, add it to the version options below.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (built from branch v<version>)"
        type: choice
        required: true
        options: ["1.1", "1.0"]
      latest:
        description: "Also make this the 'latest' version"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gh-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      LATEST: ${{ inputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/v${{ inputs.version }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install the branch's pinned tools
        run: pip install -r requirements.txt

      - name: Configure deploy
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "Bad version: $VERSION"; exit 1; }
          git config user.name "Admin CIMug"
          git config user.email "cimug.dev@gmail.com"
          git fetch origin gh-pages --depth=1

      - name: Publish with mike
        run: |
          if [ "$LATEST" = "true" ]; then
            mike deploy --push --update-aliases "$VERSION" latest
          else
            mike deploy --push "$VERSION"
          fi
